version: 2

models:
  - name: affidavit_candidates
    columns:
      - name: ACCOUNT_ID
        tests:
          - unique
          - not_null
      - name: ACCOUNT_STATUS
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE']
      - name: CASE_STATUS
        tests:
          - accepted_values:
              arguments:
                values: ['OPEN']
