version: 2

sources:
  - name: raw
    database: AFFIDAVIT_POC
    schema: RAW
    config:
      loaded_at_field: LOADED_AT
      freshness:
        warn_after:  { count: 25, period: hour }
        error_after: { count: 49, period: hour }
    tables:
      - name: customers
        description: "Customer records ingested from the source Postgres database."
      - name: accounts
        description: "Debt accounts linked to customers. Balance and status tracked here."
      - name: legal_cases
        description: "Legal cases opened against accounts. Drives affidavit eligibility."
      - name: payments
        description: "Payment transactions made against accounts."
